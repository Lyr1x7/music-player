name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'

      - name: Setup Java JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Remove system Gradle
        run: |
          sudo rm -rf /usr/share/gradle-*
          sudo rm -f /usr/bin/gradle
          which gradle || echo "Gradle removed OK"

      - name: Install Gradle 7.6
        run: |
          cd /tmp
          wget -q https://services.gradle.org/distributions/gradle-7.6-bin.zip
          unzip -q gradle-7.6-bin.zip
          sudo mv gradle-7.6 /opt/gradle
          echo "/opt/gradle/bin" >> $GITHUB_PATH

      - name: Verify Gradle version
        run: gradle -v

      - name: Install Cordova
        run: npm install -g cordova@11

      - name: Create Cordova project
        run: |
          cordova create cordova-app com.musicplayer.app "Music Player"
          rm -rf cordova-app/www/*
          cp www/index.html cordova-app/www/index.html
          cp config.xml cordova-app/config.xml

      - name: Add Android platform
        working-directory: cordova-app
        run: cordova platform add android@11

      - name: Verify platform created
        working-directory: cordova-app
        run: |
          echo "=== platforms folder ==="
          ls -la platforms/ || true
          echo "=== android folder ==="
          ls -la platforms/android/ || true

      - name: Install plugins
        working-directory: cordova-app
        run: |
          cordova plugin add cordova-plugin-file || true
          cordova plugin add cordova-plugin-media || true

      - name: Build APK (debug)
        working-directory: cordova-app
        run: cordova build android --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: music-player-apk
          path: cordova-app/platforms/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
